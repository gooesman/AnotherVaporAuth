name: Promote GooeSteamKit preview

# Manual promotion only: never rebuild binaries or publish on push/tag.
on:
  workflow_dispatch:
    inputs:
      preview_run_id:
        description: Successful Windows and Android preview run ID
        required: true
        type: string
      release_notes:
        description: User-facing notes for this exact preview build
        required: true
        type: string
      resume_draft_id:
        description: Existing draft ID to resume after reviewing its uploaded files (normally blank)
        required: false
        default: ''
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: ava-fork-release
  cancel-in-progress: false

jobs:
  promote:
    if: github.repository == 'gooesman/AnotherVaporAuth'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      # No checkout or executable from the source run is executed. Only the
      # authenticated Actions API, flat artifact files and JSON are consumed.
      - name: Verify source, packages and publish stable release
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_RUN_ID: ${{ inputs.preview_run_id }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
          RESUME_DRAFT_ID: ${{ inputs.resume_draft_id }}
        run: |
          python3 - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import re
          import shutil
          import stat
          import subprocess
          import zipfile
          from pathlib import Path
          from urllib.parse import quote

          repo = os.environ['GITHUB_REPOSITORY']
          if repo != 'gooesman/AnotherVaporAuth':
              raise SystemExit('This workflow only publishes to the AVA fork')
          run_id = os.environ['PREVIEW_RUN_ID']
          if not re.fullmatch(r'[1-9][0-9]*', run_id):
              raise SystemExit('The preview run ID must be a positive integer')
          notes = os.environ['RELEASE_NOTES'].strip()
          if not notes or len(notes.encode()) > 50000:
              raise SystemExit('Provide release notes of at most 50 KB')

          def api(endpoint, paginate=False):
              args = ['gh', 'api', f'repos/{repo}/{endpoint}']
              if paginate:
                  args += ['--paginate', '--slurp']
              return json.loads(subprocess.check_output(args))

          def require(condition, message):
              if not condition:
                  raise SystemExit(message)

          def add_windows_compatibility_alias(package, metadata, tag):
              require(package.name == f'GooeSteamKit-{tag}-windows-x64-setup.exe'
                      and metadata['release_file'] == package.name,
                      'Unexpected primary Windows package name')
              alias = package.with_name(f'AVA-pc-{tag}-windows-x64-setup.exe')
              shutil.copyfile(package, alias)
              with alias.open('rb') as stream:
                  digest = hashlib.file_digest(stream, 'sha256').hexdigest()
              require(digest == metadata['sha256'] and alias.stat().st_size == metadata['size'],
                      'Windows compatibility alias differs from the verified package')
              return alias, {**metadata, 'release_file': alias.name,
                             'compatibility_alias_for': package.name}

          def select_release_draft(releases, tag, commit, resume_id):
              matches = [release for release in releases if release.get('tag_name') == tag]
              if resume_id is None:
                  require(not matches, 'This release already exists; review its draft before resuming')
                  return None
              require(len(matches) == 1, 'Exactly one matching draft is required to resume')
              draft = matches[0]
              require(type(draft.get('id')) is int and draft['id'] == resume_id
                      and draft.get('draft') is True and draft.get('prerelease') is False
                      and draft.get('target_commitish') == commit,
                      'The requested draft must match this exact preview commit')
              return draft['id']

          def verify_release_draft(uploaded, tag, commit, assets, notes):
              require(uploaded.get('draft') is True and uploaded.get('prerelease') is False
                      and uploaded.get('tag_name') == tag and uploaded.get('target_commitish') == commit,
                      'Expected the draft for this exact stable release')
              require(isinstance(uploaded.get('body'), str) and uploaded['body'].strip() == notes.strip(),
                      'Draft release notes differ from the requested notes')
              remote = uploaded.get('assets', [])
              require(len(remote) == len(assets) and {a['name'] for a in remote} == {p.name for p in assets},
                      'Unexpected or duplicate release assets')
              for path in assets:
                  asset = next(a for a in remote if a['name'] == path.name)
                  with path.open('rb') as stream:
                      digest = hashlib.file_digest(stream, 'sha256').hexdigest()
                  require(asset.get('state') == 'uploaded' and asset.get('size') == path.stat().st_size
                          and asset.get('digest') == 'sha256:' + digest, 'Uploaded asset digest or state mismatch')

          workflow_path = '.github/workflows/windows-preview.yml'
          workflow = api('actions/workflows/windows-preview.yml')
          run = api(f'actions/runs/{run_id}')
          require(
              run.get('workflow_id') == workflow['id'] and workflow.get('path') == workflow_path
              and run.get('path', '').split('@', 1)[0] == workflow_path
              and run.get('head_repository', {}).get('full_name') == repo
              and run.get('repository', {}).get('full_name') == repo
              and run.get('event') in ('push', 'workflow_dispatch')
              and run.get('status') == 'completed' and run.get('conclusion') == 'success',
              'Source must be a successful preview workflow in this repository',
          )
          commit = run['head_sha']
          require(re.fullmatch(r'[0-9a-f]{40}', commit), 'Invalid source commit')
          source = api(f'contents/app/pubspec.yaml?ref={commit}')
          pubspec = base64.b64decode(source['content']).decode()
          match = re.search(r'^version:\s*((?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*))(?:\+[0-9]+)?\s*$', pubspec, re.M)
          require(match is not None, 'Source commit must have a three-part version')
          version = match[1]
          build = 100000 + run['run_number']
          require(0 < build <= 2100000000, 'Build number exceeds the Android limit')
          tag = f'v{version}+{build}'
          tag_pattern = re.compile(r'^v([0-9]+)\.([0-9]+)\.([0-9]+)\+([1-9][0-9]*)$')
          resume_text = os.environ.get('RESUME_DRAFT_ID', '').strip()
          require(not resume_text or re.fullmatch(r'[1-9][0-9]*', resume_text), 'Invalid draft ID')
          resume_id = int(resume_text) if resume_text else None
          releases = [item for page in api('releases?per_page=100', paginate=True) for item in page]
          draft_id = select_release_draft(releases, tag, commit, resume_id)
          for release in releases:
              previous = tag_pattern.fullmatch(release.get('tag_name', ''))
              if previous and not release.get('draft') and not release.get('prerelease'):
                  require(int(previous[4]) < build, 'Refusing to publish a stale build')
                  require(tuple(map(int, previous.group(1, 2, 3))) <= tuple(map(int, version.split('.'))), 'Refusing a version downgrade')
          refs = api(f'git/matching-refs/tags/{quote(tag, safe="")}')
          require(not any(ref['ref'] == f'refs/tags/{tag}' for ref in refs), 'The target tag already exists')

          artifact_pages = api(f'actions/runs/{run_id}/artifacts?per_page=100', paginate=True)
          artifacts = [item for page in artifact_pages for item in page['artifacts']]
          output = Path(os.environ['RUNNER_TEMP']) / 'fork-release'
          output.mkdir()
          manifests = []
          payloads = []
          max_size = 512 * 1024 * 1024
          platforms = [
              ('windows-x64', f'AVA-windows-installer-preview-{commit}', 'windows-preview.json', f'GooeSteamKit-{tag}-windows-x64-setup.exe'),
              ('android-arm64', f'AVA-android-preview-{commit}', 'android-preview.json', 'app-cn-release.apk'),
          ]
          for platform, artifact_name, metadata_name, source_name in platforms:
              matches = [a for a in artifacts if a['name'] == artifact_name and not a['expired']]
              require(len(matches) == 1, f'Missing or ambiguous artifact: {artifact_name}')
              artifact = matches[0]
              require(0 < artifact['size_in_bytes'] <= max_size + 1024 * 1024, 'Artifact exceeds the size limit')
              archive = output / f'{platform}.zip'
              with archive.open('wb') as stream:
                  subprocess.run(['gh', 'api', f'repos/{repo}/actions/artifacts/{artifact["id"]}/zip'], stdout=stream, check=True)
              with archive.open('rb') as stream:
                  archive_hash = hashlib.file_digest(stream, 'sha256').hexdigest()
              require(artifact.get('digest') == 'sha256:' + archive_hash, 'Artifact archive digest mismatch')
              with zipfile.ZipFile(archive) as bundle:
                  entries = [item for item in bundle.infolist() if not item.is_dir()]
                  require(len(entries) == 2 and {item.filename for item in entries} == {source_name, metadata_name}, 'Artifact must contain only the expected flat package and metadata')
                  require(all(not stat.S_ISLNK(item.external_attr >> 16) for item in entries), 'Artifact symlinks are forbidden')
                  require(bundle.getinfo(metadata_name).file_size <= 65536, 'Metadata is too large')
                  metadata = json.loads(bundle.read(metadata_name).decode('utf-8-sig'))
                  expected = {
                      'schema': 1, 'repository': repo, 'workflow': workflow_path,
                      'run_id': int(run_id), 'run_number': run['run_number'], 'commit': commit,
                      'version': version, 'build': build, 'platform': platform, 'file': source_name,
                  }
                  require(all(type(metadata.get(key)) is type(value) and metadata[key] == value for key, value in expected.items()), 'Package provenance does not match the source run')
                  # Rerunning only failed jobs can retain a successful artifact
                  # from an earlier attempt of the same run/commit/build.
                  require(type(metadata.get('run_attempt')) is int and 1 <= metadata['run_attempt'] <= run['run_attempt'], 'Invalid run attempt')
                  size = metadata.get('size')
                  require(type(size) is int and 0 < size <= max_size and bundle.getinfo(source_name).file_size == size, 'Package size mismatch')
                  require(isinstance(metadata.get('sha256'), str) and re.fullmatch(r'[0-9a-f]{64}', metadata['sha256']), 'Invalid package digest')
                  if platform == 'android-arm64':
                      require(metadata.get('build_mode') == 'release', 'Android package must be an optimized release build')
                      require(metadata.get('package') == 'pro.dotslash.ava.fork', 'Unexpected Android package identity')
                      require(metadata.get('signer_sha256') == 'a6f42083bc64974ddd82120735a85259cb8751cd22134d6255e5f621e93aec3f', 'Unexpected Android signer')
                  name = source_name if platform == 'windows-x64' else f'AVA-Fork-{tag}-android-arm64.apk'
                  destination = output / name
                  with bundle.open(source_name) as src, destination.open('wb') as dst:
                      shutil.copyfileobj(src, dst)
                  with destination.open('rb') as stream:
                      digest = hashlib.file_digest(stream, 'sha256').hexdigest()
                  require(digest == metadata['sha256'], 'Package SHA-256 mismatch')
                  manifests.append({**metadata, 'release_file': name, 'artifact_id': artifact['id'], 'artifact_sha256': archive_hash})
                  payloads.append(destination)
                  if platform == 'windows-x64':
                      # Older installed updaters only recognize AVA-pc names.
                      # Keep an identical, separately verified compatibility asset.
                      alias, alias_manifest = add_windows_compatibility_alias(destination, manifests[-1], tag)
                      manifests.append(alias_manifest)
                      payloads.append(alias)

          # Do not distribute the Android GPL component without its matching
          # source snapshot and license. Download only flat files, never execute
          # or extract the contained upstream source archive during promotion.
          pins_file = api(f'contents/third_party/mihomo/core.json?ref={commit}')
          pins = json.loads(base64.b64decode(pins_file['content']))
          require(re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+', pins['version']) and re.fullmatch(r'[0-9a-f]{40}', pins['commit']), 'Invalid component identity')
          source_name = f'mihomo-{pins["version"]}-source.tar.gz'
          expected_source = {source_name: pins['source_sha256']}
          for name in ('LICENSE', 'NOTICE'):
              item = api(f'contents/third_party/mihomo/{name}?ref={commit}')
              expected_source[f'mihomo-{name}.txt'] = hashlib.sha256(base64.b64decode(item['content'])).hexdigest()
          matches = [a for a in artifacts if a['name'] == f'AVA-steam-core-source-{commit}' and not a['expired']]
          require(len(matches) == 1, 'Corresponding component source artifact is required')
          artifact = matches[0]
          require(0 < artifact['size_in_bytes'] <= 40 * 1024 * 1024, 'Component source exceeds size limit')
          archive = output / 'core-source.zip'
          with archive.open('wb') as stream:
              subprocess.run(['gh', 'api', f'repos/{repo}/actions/artifacts/{artifact["id"]}/zip'], stdout=stream, check=True)
          require(artifact.get('digest') == 'sha256:' + hashlib.sha256(archive.read_bytes()).hexdigest(), 'Source artifact digest mismatch')
          source_manifest = []
          with zipfile.ZipFile(archive) as bundle:
              entries = [e for e in bundle.infolist() if not e.is_dir()]
              require(len(entries) == 4 and {e.filename for e in entries} == set(expected_source) | {'core-provenance.json'}, 'Unexpected component source files')
              require(all(not stat.S_ISLNK(e.external_attr >> 16) and e.file_size <= 32 * 1024 * 1024 for e in entries), 'Invalid component source entry')
              require(bundle.getinfo('core-provenance.json').file_size <= 65536, 'Component metadata too large')
              metadata = json.loads(bundle.read('core-provenance.json'))
              require(metadata.get('schema') == 1 and metadata.get('component') == 'mihomo' and metadata.get('version') == pins['version']
                      and metadata.get('source_commit') == pins['commit'] and metadata.get('repository') == repo
                      and metadata.get('commit') == commit and metadata.get('run_id') == int(run_id), 'Component source provenance mismatch')
              for name, expected_digest in expected_source.items():
                  content = bundle.read(name)
                  digest = hashlib.sha256(content).hexdigest()
                  require(digest == expected_digest and metadata['files'].get(name) == {'sha256': digest, 'size': len(content)}, 'Component source hash mismatch')
                  destination = output / name
                  destination.write_bytes(content)
                  payloads.append(destination)
                  source_manifest.append({'release_file': name, 'sha256': digest, 'size': len(content)})

          provenance = output / 'release-provenance.json'
          provenance.write_text(json.dumps({'tag': tag, 'source_run': run['html_url'], 'packages': manifests, 'component_source': source_manifest}, indent=2) + '\n')
          checksums = output / 'SHA256SUMS.txt'
          checksums.write_text(''.join(f'{item["sha256"]}  {item["release_file"]}\n' for item in manifests + source_manifest))
          assets = payloads + [provenance, checksums]
          notes_file = output / 'notes.md'
          notes_file.write_text(notes + f'\n\nSource preview: {run["html_url"]}\nCommit: `{commit}`\nBuild: `{build}`\n')
          # Keep the release hidden until GitHub confirms every uploaded byte.
          # On failure, leave the draft for review. Explicit resumption only
          # verifies its existing files; it never replaces or uploads an asset.
          if draft_id is None:
              subprocess.run(['gh', 'release', 'create', tag, *map(str, assets), '--repo', repo,
                              '--target', commit, '--title', f'GooeSteamKit {tag}', '--notes-file', str(notes_file), '--draft'], check=True)
              # Drafts may not have a Git tag yet, so the by-tag REST endpoint
              # can return 404. Discover the draft and use its stable numeric ID.
              created = [item for page in api('releases?per_page=100', paginate=True) for item in page
                         if item.get('tag_name') == tag]
              require(len(created) == 1 and type(created[0].get('id')) is int, 'Expected one new release draft')
              draft_id = select_release_draft(created, tag, commit, created[0]['id'])
          uploaded = api(f'releases/{draft_id}')
          verify_release_draft(uploaded, tag, commit, assets, notes_file.read_text())
          subprocess.run(['gh', 'api', '--method', 'PATCH', f'repos/{repo}/releases/{draft_id}', '--input', '-'],
                         input=json.dumps({'draft': False, 'make_latest': 'true'}).encode(),
                         stdout=subprocess.DEVNULL, check=True)
          published = api(f'releases/{draft_id}')
          latest = api('releases/latest')
          require(published.get('draft') is False and published.get('prerelease') is False
                  and published.get('tag_name') == tag and latest.get('id') == draft_id,
                  'Release was not published as the latest stable version')
          print(f'Published verified stable release {tag}')
          PY
